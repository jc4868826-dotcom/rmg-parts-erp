<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tablero Ejecutivo B2B - RMG Parts</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --border: #334155; --text: #f8fafc; --accent: #38bdf8; --user: #0284c7; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: var(--panel); padding: 18px 28px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 18px; color: var(--accent); font-weight: 600; letter-spacing: 0.5px; }
        #chat-container { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 20px; max-width: 1000px; width: 100%; margin: 0 auto; box-sizing: border-box; }
        .msg { padding: 22px 26px; border-radius: 10px; max-width: 90%; line-height: 1.6; font-size: 14px; }
        .user { background: var(--user); align-self: flex-end; color: white; border-bottom-right-radius: 2px; }
        .assistant { background: var(--panel); align-self: flex-start; border: 1px solid var(--border); border-bottom-left-radius: 2px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); }
        .assistant h3 { color: var(--accent); margin-top: 20px; margin-bottom: 10px; font-size: 15px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        .assistant h3:first-child { margin-top: 0; }
        .assistant ul { padding-left: 20px; margin: 10px 0; }
        .assistant li { margin-bottom: 8px; }
        table { width: 100%; border-collapse: collapse; margin: 16px 0; background: #0b1120; border-radius: 6px; overflow: hidden; }
        th, td { border: 1px solid var(--border); padding: 10px 14px; text-align: left; font-size: 13px; }
        th { background: #162032; color: var(--accent); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
        tr:nth-child(even) { background: rgba(255, 255, 255, 0.02); }
        #input-area { background: var(--panel); padding: 18px; border-top: 1px solid var(--border); }
        #form-container { max-width: 1000px; margin: 0 auto; display: flex; gap: 12px; }
        textarea { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: white; padding: 14px; font-size: 14px; resize: none; height: 50px; font-family: inherit; }
        textarea:focus { outline: none; border-color: var(--accent); }
        button { background: var(--user); color: white; border: none; padding: 0 28px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0369a1; }
    </style>
</head>
<body>
    <header>
        <h1>Zara | Tablero de Inteligencia Comercial B2B</h1>
    </header>
    <div id="chat-container">
        <div class="msg assistant" id="welcome-msg"></div>
    </div>
    <div id="input-area">
        <div id="form-container">
            <textarea id="input-msg" placeholder="Ej: tengo un cliente posible que distribuye a talleres de motos"></textarea>
            <button onclick="enviar()">Analizar</button>
        </div>
    </div>
    <script>
        document.getElementById("welcome-msg").innerHTML = marked.parse("### Sistema Conectado\nHola JC. Tengo el catálogo maestro de **RMG Parts** cargado y listo en memoria. ¿Qué prospecto analizamos hoy?");
        let historial = [];
        async function enviar() {
            const input = document.getElementById("input-msg");
            const texto = input.value.trim();
            if (!texto) return;
            appendMsg(texto, "user");
            input.value = "";
            historial.push({"role": "user", "content": texto});
            const res = await fetch("/chat", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({mensajes: historial})
            });
            const data = await res.json();
            if (data.error) {
                appendMsg("Error: " + data.error, "assistant");
            } else {
                appendMsg(data.respuesta, "assistant");
                historial.push({"role": "assistant", "content": data.respuesta});
            }
        }
        function appendMsg(txt, tipo) {
            const cont = document.getElementById("chat-container");
            const div = document.createElement("div");
            div.className = "msg " + tipo;
            if (tipo === "assistant") {
                div.innerHTML = marked.parse(txt);
            } else {
                div.textContent = txt;
            }
            cont.appendChild(div);
            cont.scrollTop = cont.scrollHeight;
        }
    </script>
</body>
</html>
